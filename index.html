<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>"Black" Cast Calculator</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.container {
  background:white;
  border-radius:20px;
  padding:40px;
  max-width:800px;
  width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
h1 { margin-bottom:10px; }
.subtitle { color:#666; margin-bottom:30px; }
.search-box { display:flex; gap:10px; }
input { flex:1; padding:15px; border-radius:10px; border:2px solid #ddd; }
button {
  padding:15px 30px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  font-weight:600;
  cursor:pointer;
}
.loading, .results, .search-results, .error { display:none; margin-top:20px; }
.loading.active, .results.active, .search-results.active, .error.active { display:block; }
.result-item {
  padding:15px;
  background:#f4f4f4;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
}
.stats-container {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin:20px 0;
}
.stat-card {
  background:#f4f4f4;
  padding:20px;
  border-radius:10px;
  text-align:center;
}
.percentage-bar {
  height:30px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
}
.percentage-fill {
  height:100%;
  background:linear-gradient(90deg,#667eea,#764ba2);
  color:white;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:width 1s;
}
.cast-member {
  display:flex;
  align-items:center;
  background:#f4f4f4;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}
.cast-member img {
  width:50px;
  height:50px;
  border-radius:50%;
  margin-right:15px;
  background:#ccc;
}
.note {
  background:#fff3cd;
  padding:15px;
  margin-top:20px;
  border-left:4px solid #ffc107;
}
</style>
</head>

<body>
<div class="container">
<h1>🎬 "Black" Cast Calculator</h1>
<p class="subtitle">Wikipedia-verified cast analysis</p>

<div class="search-box">
<input id="searchInput" placeholder="Enter movie or TV show">
<button id="searchBtn">Search</button>
</div>

<div class="search-results" id="searchResults">
<h3>Select a title:</h3>
<div id="resultsList"></div>
</div>

<div class="loading" id="loading">Analyzing cast…</div>
<div class="error" id="error"></div>

<div class="results" id="results">
<h2 id="titleName"></h2>
<p id="titleMeta"></p>

<div class="stats-container">
<div class="stat-card"><div>Total Cast</div><div id="totalCast">0</div></div>
<div class="stat-card"><div>Black/African-American</div><div id="blackCast">0</div></div>
<div class="stat-card"><div>Percentage</div><div id="percentage">0%</div></div>
</div>

<div class="percentage-bar">
<div class="percentage-fill" id="percentageFill">0%</div>
</div>

<h3>Identified Cast Members</h3>
<div id="castMembers"></div>

<div class="note">
<strong>Note:</strong> This tool uses Wikipedia categories and biography text.
Results are heuristic and informational — not definitive.
</div>
</div>
</div>

<script>
const API_KEY = "b17971cb15a4d237093adeb4a6253719";
const BASE_URL = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w200";

const searchBtn = document.getElementById("searchBtn");
searchBtn.onclick = searchTitle;

async function getWikipediaData(name) {
  const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&prop=extracts|categories&exintro=true&explaintext=true&cllimit=50&titles=${encodeURIComponent(name)}&origin=*`;
  const res = await fetch(url);
  const data = await res.json();
  const page = Object.values(data.query.pages)[0];
  if (!page || page.missing) return null;
  return {
    extract: page.extract?.toLowerCase() || "",
    categories: (page.categories || []).map(c => c.title.toLowerCase())
  };
}

async function searchTitle() {
  const q = searchInput.value.trim();
  if (!q) return;
  loading.classList.add("active");

  const [m,t] = await Promise.all([
    fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${q}`).then(r=>r.json()),
    fetch(`${BASE_URL}/search/tv?api_key=${API_KEY}&query=${q}`).then(r=>r.json())
  ]);

  resultsList.innerHTML = "";
  [...m.results.slice(0,5), ...t.results.slice(0,5)].forEach(r=>{
    const d = document.createElement("div");
    d.className="result-item";
    d.textContent = r.title || r.name;
    d.onclick = ()=>selectTitle(r, r.title ? "movie":"tv");
    resultsList.appendChild(d);
  });

  loading.classList.remove("active");
  searchResults.classList.add("active");
}

async function selectTitle(item,type){
  searchResults.classList.remove("active");
  loading.classList.add("active");

  const credits = await fetch(`${BASE_URL}/${type}/${item.id}/credits?api_key=${API_KEY}`).then(r=>r.json());
  const cast = credits.cast.slice(0,15);

  const verified = [];

  for (const c of cast) {
    const wiki = await getWikipediaData(c.name);
    if (!wiki) continue;

    const match =
      wiki.extract.includes("african-american") ||
      wiki.categories.some(cat =>
        cat.includes("african-american") ||
        cat.includes("black american")
      );

    if (match) verified.push(c);
  }

  renderResults(item, cast, verified, type);
  loading.classList.remove("active");
}

function renderResults(title, cast, verified, type){
  results.classList.add("active");
  titleName.textContent = title.title || title.name;
  titleMeta.textContent = type.toUpperCase();

  totalCast.textContent = cast.length;
  blackCast.textContent = verified.length;

  const pct = ((verified.length / cast.length) * 100).toFixed(1);
  percentage.textContent = pct + "%";
  percentageFill.style.width = pct + "%";
  percentageFill.textContent = pct + "%";

  castMembers.innerHTML = "";
  verified.forEach(m=>{
    const d=document.createElement("div");
    d.className="cast-member";
    d.innerHTML=`
      <img src="${m.profile_path ? IMG+m.profile_path : ""}">
      <div>
        <strong>${m.name}</strong><br>
        <small>${m.character||""}</small>
      </div>`;
    castMembers.appendChild(d);
  });
}
</script>
</body>
</html>
